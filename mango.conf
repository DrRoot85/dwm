# More option see https://github.com/DreamMaoMao/mango/wiki/
#
# This file = your existing MangoWM config, extended with equivalents
# of your dwm config.h. Wherever dwm and Mango disagreed (colors, gaps,
# border width, mfact, terminal, etc.) Mango's original value was kept.
# New sections are clearly marked "# --- from dwm ---".

# Window effect
blur=0
blur_layer=0
blur_optimized=1
blur_params_num_passes = 2
blur_params_radius = 5
blur_params_noise = 0.02
blur_params_brightness = 0.9
blur_params_contrast = 0.9
blur_params_saturation = 1.2

shadows = 0
layer_shadows = 0
shadow_only_floating = 1
shadows_size = 10
shadows_blur = 15
shadows_position_x = 0
shadows_position_y = 0
shadowscolor= 0x000000ff

border_radius=6
no_radius_when_single=0
focused_opacity=1.0
unfocused_opacity=1.0

# Animation Configuration(support type:zoom,slide)
# tag_animation_direction: 1-horizontal,0-vertical
animations=1
layer_animations=1
animation_type_open=slide
animation_type_close=slide
animation_fade_in=1
animation_fade_out=1
tag_animation_direction=1
zoom_initial_ratio=0.4
zoom_end_ratio=0.8
fadein_begin_opacity=0.5
fadeout_begin_opacity=0.8
animation_duration_move=500
animation_duration_open=400
animation_duration_tag=350
animation_duration_close=800
animation_duration_focus=0
animation_curve_open=0.46,1.0,0.29,1
animation_curve_move=0.46,1.0,0.29,1
animation_curve_tag=0.46,1.0,0.29,1
animation_curve_close=0.08,0.92,0,1
animation_curve_focus=0.46,1.0,0.29,1
animation_curve_opafadeout=0.5,0.5,0.5,0.5
animation_curve_opafadein=0.46,1.0,0.29,1

# Scroller Layout Setting
scroller_structs=20
scroller_default_proportion=0.8
scroller_focus_center=0
scroller_prefer_center=0
edge_scroller_pointer_focus=1
edge_scroller_focus_allow_speed=0.0
scroller_default_proportion_single=1.0
scroller_proportion_preset=0.5,0.8,1.0

# Master-Stack Layout Setting
# NOTE: dwm's mfact=0.55 / nmaster=1 already matched these Mango defaults, no change needed
new_is_master=1
default_mfact=0.55
default_nmaster=1
smartgaps=0

# Dwindle Layout Setting
dwindle_smart_split=0
dwindle_drop_simple_split=1
dwindle_manual_split=0
dwindle_hsplit=1
dwindle_vsplit=1
dwindle_preserve_split=0

# Overview Setting
hotarea_size=10
enable_hotarea=0
ov_tab_mode=0
ov_no_resize=1
overviewgappi=5
overviewgappo=30

# Misc
no_border_when_single=0
axis_bind_apply_timeout=100
focus_on_activate=1
idleinhibit_ignore_visible=0
sloppyfocus=1
warpcursor=1
focus_cross_monitor=0
focus_cross_tag=0
enable_floating_snap=0
snap_distance=30
cursor_size=24
drag_tile_to_tile=1
drag_tile_small=1

# keyboard
repeat_rate=25
repeat_delay=600
numlockon=0
xkb_rules_layout=us

# Trackpad
# need relogin to make it apply
disable_trackpad=0
tap_to_click=1
tap_and_drag=1
drag_lock=1
trackpad_natural_scrolling=0
disable_while_typing=1
left_handed=0
middle_button_emulation=0
swipe_min_threshold=1

# mouse
# need relogin to make it apply
mouse_natural_scrolling=0

# Appearance
# NOTE: dwm used gappih=20/gappiv=10/gappoh=10/gappov=30 and borderpx=1 and
# selbordercolor #005577 — all kept as Mango's original values below since
# Mango is the default on conflict. Edit these directly if you'd rather
# match the old dwm look.
gappih=5
gappiv=5
gappoh=10
gappov=10
scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.9
borderpx=4
rootcolor=0x201b14ff
bordercolor=0x444444ff
dropcolor=0x8FBA7C55
splitcolor=0xEB441EFF
focuscolor=0xc9b890ff
maximizescreencolor=0x89aa61ff
urgentcolor=0xad401fff
scratchpadcolor=0x516c93ff
globalcolor=0xb153a7ff
overlaycolor=0x14a57cff

# layout support:
# tile,scroller,grid,deck,monocle,center_tile,vertical_tile,vertical_scroller
# dwm's default layout was tile[0] with mfact 0.55/nmaster 1 -> already matches, unchanged
tagrule=id:1,layout_name:tile
tagrule=id:2,layout_name:tile
tagrule=id:3,layout_name:tile
tagrule=id:4,layout_name:tile
tagrule=id:5,layout_name:tile
tagrule=id:6,layout_name:tile
tagrule=id:7,layout_name:tile
tagrule=id:8,layout_name:tile
tagrule=id:9,layout_name:tile

# --- from dwm: window rules (rules[] in config.h) ---
# Gimp -> always floating
windowrule=isfloating:1,appid:Gimp
# Firefox -> opens on tag 9 (dwm's 1<<8), noswallow disabled (-1 in dwm = inherit)
windowrule=tags:9,appid:firefox
# St (dwm's terminal) -> marked as terminal for swallowing behavior
windowrule=isterm:1,appid:st
# xev "Event Tester" window -> don't let it swallow a terminal
windowrule=noswallow:1,title:Event Tester

# Key Bindings
# key name refer to `xev` or `wev` command output,
# mod keys name: super,ctrl,alt,shift,none

# reload config
bind=SUPER,r,reload_config

# menu and terminal
bind=Alt,space,spawn,rofi -show drun
bind=Alt,Return,spawn,foot

# exit
bind=SUPER,m,quit
bind=ALT,q,killclient,

# switch window focus
bind=SUPER,Tab,focusstack,next
bind=ALT,Left,focusdir,left
bind=ALT,Right,focusdir,right
bind=ALT,Up,focusdir,up
bind=ALT,Down,focusdir,down

# swap window
bind=SUPER+SHIFT,Up,exchange_client,up
bind=SUPER+SHIFT,Down,exchange_client,down
bind=SUPER+SHIFT,Left,exchange_client,left
bind=SUPER+SHIFT,Right,exchange_client,right

# switch window status
bind=SUPER,g,toggleglobal,
bind=ALT,Tab,togglejump,
bind=ALT,backslash,togglefloating,
bind=ALT,a,togglemaximizescreen,
bind=ALT,f,togglefullscreen,
bind=ALT+SHIFT,f,togglefakefullscreen,
bind=SUPER,i,minimized,
bind=SUPER,o,toggleoverlay,
bind=SUPER+SHIFT,I,restore_minimized
bind=ALT,z,toggle_scratchpad

# scroller layout
bind=ALT,e,set_proportion,1.0
bind=ALT,x,switch_proportion_preset,
bind=alt+super+ctrl,Left,scroller_stack,left
bind=alt+super+ctrl,Right,scroller_stack,right
bind=alt+super+ctrl,Up,scroller_stack,up
bind=alt+super+ctrl,Down,scroller_stack,down

#dwindle layout(manual split mode)
bind=alt+shift,Return,dwindle_toggle_split_direction

# switch layout
bind=SUPER,n,switch_layout

# tag switch
bind=SUPER,Left,viewtoleft,0
bind=CTRL,Left,viewtoleft_have_client,0
bind=SUPER,Right,viewtoright,0
bind=CTRL,Right,viewtoright_have_client,0
bind=CTRL+SUPER,Left,tagtoleft,0
bind=CTRL+SUPER,Right,tagtoright,0

bind=Ctrl,1,view,1,0
bind=Ctrl,2,view,2,0
bind=Ctrl,3,view,3,0
bind=Ctrl,4,view,4,0
bind=Ctrl,5,view,5,0
bind=Ctrl,6,view,6,0
bind=Ctrl,7,view,7,0
bind=Ctrl,8,view,8,0
bind=Ctrl,9,view,9,0

# tag: move client to the tag and focus it
# tagsilent: move client to the tag and not focus it
# bind=Alt,1,tagsilent,1
bind=Alt,1,tag,1,0
bind=Alt,2,tag,2,0
bind=Alt,3,tag,3,0
bind=Alt,4,tag,4,0
bind=Alt,5,tag,5,0
bind=Alt,6,tag,6,0
bind=Alt,7,tag,7,0
bind=Alt,8,tag,8,0
bind=Alt,9,tag,9,0

# monitor switch
bind=alt+shift,Left,focusmon,left
bind=alt+shift,Right,focusmon,right
bind=SUPER+Alt,Left,tagmon,left
bind=SUPER+Alt,Right,tagmon,right

# gaps
bind=ALT+SHIFT,X,incgaps,1
bind=ALT+SHIFT,Z,incgaps,-1
bind=ALT+SHIFT,R,togglegaps

# movewin
bind=CTRL+SHIFT,Up,movewin,+0,-50
bind=CTRL+SHIFT,Down,movewin,+0,+50
bind=CTRL+SHIFT,Left,movewin,-50,+0
bind=CTRL+SHIFT,Right,movewin,+50,+0

# resizewin
bind=CTRL+ALT,Up,resizewin,+0,-50
bind=CTRL+ALT,Down,resizewin,+0,+50
bind=CTRL+ALT,Left,resizewin,-50,+0
bind=CTRL+ALT,Right,resizewin,+50,+0

# --- from dwm: your custom launchers/scripts (dmenucmd, clipcmd, XF86 keys, etc) ---
# dmenu launcher (dwm's MODKEY+p). Mango's Alt+Space/rofi already covers a
# launcher, this is added as-is since it's a different key combo (no conflict).
bind=SUPER,p,spawn,dmenu_run -m 0 -fn "GoMono Nerd Font:size=10" -nb "#222222" -nf "#bbbbbb" -sb "#005577" -sf "#eeeeee"

# kitty terminal (dwm's MODKEY+Shift+Return). Mango's Alt+Return/foot stays
# as the default terminal binding; kitty is added on a free combo.
bind=SUPER+SHIFT,Return,spawn,kitty

# clipmenu / greenclip clipboard managers
bind=SUPER,c,spawn,clipmenu -m 0 -nb "#222222" -nf "#bbbbbb" -sb "#005577" -sf "#eeeeee"
bind=SUPER,v,spawn_shell,~/.local/bin/greenclip-dmenu

# language switch script
bind=SUPER,F11,spawn,/home/DrRoot/.local/bin/lang

# XF86 media keys -> your existing scripts
bind=NONE,XF86AudioMicMute,spawn,/home/DrRoot/.local/bin/volume --toggle-mic
bind=NONE,XF86AudioLowerVolume,spawn,/home/DrRoot/.local/bin/volume --dec
bind=NONE,XF86AudioRaiseVolume,spawn,/home/DrRoot/.local/bin/volume --inc
bind=NONE,XF86AudioMute,spawn,/home/DrRoot/.local/bin/volume --toggle

# focusstack prev (dwm's MODKEY+k, complements Mango's default SUPER+Tab=next)
bind=SUPER,j,focusstack,next
bind=SUPER,k,focusstack,prev

# nmaster / mfact adjustment (dwm's MODKEY+i/d and MODKEY+h/l)
bind=SUPER,i,incnmaster,+1
bind=SUPER,d,incnmaster,-1
bind=SUPER,h,setmfact,-0.05
bind=SUPER,l,setmfact,+0.05

# zoom / swap-to-master (dwm's MODKEY+Return)
bind=SUPER,Return,zoom,

# view previous tagset (dwm's MODKEY+Tab)
bind=SUPER,Tab,view,-1

# extra kill binding to mirror dwm's MODKEY+q (Mango's default is ALT+q, kept above)
bind=SUPER,q,killclient,

# set layout directly (dwm's MODKEY+t/f, tile & monocle - direct key matches)
bind=SUPER,t,setlayout,tile
bind=SUPER,f,setlayout,monocle
# dwm's MODKEY+m set the spiral layout, but Mango's SUPER+m is already bound
# to quit (kept per "Mango wins on conflict") — spiral moved to SUPER+y instead
bind=SUPER,y,setlayout,scroller

# toggle floating (dwm's MODKEY+Shift+space, extra to Mango's ALT+backslash)
bind=SUPER+SHIFT,space,togglefloating,

# focusmon / tagmon by comma/period (dwm style, extra to Mango's alt+shift arrows)
bind=SUPER,comma,focusmon,left
bind=SUPER,period,focusmon,right
bind=SUPER+SHIFT,comma,tagmon,left,1
bind=SUPER+SHIFT,period,tagmon,right,1

# toggleview / toggletag per-tag (dwm's MODKEY+Ctrl / MODKEY+Ctrl+Shift, new
# functionality not present in Mango's default config)
bind=SUPER+CTRL,1,toggleview,1
bind=SUPER+CTRL,2,toggleview,2
bind=SUPER+CTRL,3,toggleview,3
bind=SUPER+CTRL,4,toggleview,4
bind=SUPER+CTRL,5,toggleview,5
bind=SUPER+CTRL,6,toggleview,6
bind=SUPER+CTRL,7,toggleview,7
bind=SUPER+CTRL,8,toggleview,8
bind=SUPER+CTRL,9,toggleview,9

bind=SUPER+CTRL+SHIFT,1,toggletag,1
bind=SUPER+CTRL+SHIFT,2,toggletag,2
bind=SUPER+CTRL+SHIFT,3,toggletag,3
bind=SUPER+CTRL+SHIFT,4,toggletag,4
bind=SUPER+CTRL+SHIFT,5,toggletag,5
bind=SUPER+CTRL+SHIFT,6,toggletag,6
bind=SUPER+CTRL+SHIFT,7,toggletag,7
bind=SUPER+CTRL+SHIFT,8,toggletag,8
bind=SUPER+CTRL+SHIFT,9,toggletag,9

# quit (extra mirror of dwm's MODKEY+Shift+q, Mango's default quit is SUPER+m)
bind=SUPER+SHIFT,q,quit,

# sticky/global toggle (dwm's MODKEY+s -> closest Mango equivalent is toggleglobal,
# already bound to SUPER+g above; skipped here to avoid duplicate binding)

# NOT PORTED (no Mango equivalent):
#   - togglebar (MODKEY+b): Mango has no built-in status bar; use Waybar and
#     toggle it externally, e.g. bind=SUPER,b,spawn_shell,pkill -SIGUSR1 waybar
#   - setcfact / stack ratio (MODKEY+Shift+h/l/o): no cfact-style dispatcher in Mango
#   - defaultgaps (MODKEY+Ctrl+Shift+0): no "reset gaps" dispatcher, use togglegaps/incgaps
#   - xrdb reload (MODKEY+F5): X11-only, not applicable under Wayland
#   - self_restart (MODKEY+Shift+r): Mango already reload_config's on SUPER+r above,
#     which is the Wayland equivalent (no full-restart dispatcher exists)

# Mouse Button Bindings
# btn_left and btn_right can't bind none mod key
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=NONE,btn_middle,togglemaximizescreen,0
mousebind=SUPER,btn_right,moveresize,curresize
# --- from dwm: ClkClientWin+MODKEY Button2 = togglefloating ---
mousebind=SUPER,btn_middle,togglefloating


# Axis Bindings
axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client


# layer rule
layerrule=animation_type_open:zoom,layer_name:rofi
